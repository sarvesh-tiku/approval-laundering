[project]
name = "approval-laundering"
version = "0.1.0"
description = "Compositional failures in multi-agent oversight: a synthetic-ledger experiment"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "python-dotenv>=1.0", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
